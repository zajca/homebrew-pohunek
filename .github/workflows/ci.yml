name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  formula:
    name: formula (${{ matrix.formula }})
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - formula: pohunek
            repository: zajca/pohunek
            surface: false
          - formula: pohunek-gui
            repository: zajca/pohunek-work
            surface: true
          - formula: pohunek-web
            repository: zajca/pohunek-work
            surface: true
    env:
      GH_TOKEN: ${{ github.token }}
      HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_FROM_API: "1"
      # Protocol version spoken by the surface formulae (pohunek-work, public
      # protocol v3); the installed core must support it.
      SURFACE_PROTOCOL: "3"
    steps:
      - name: Check out the tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Tap the checkout
        run: brew tap zajca/pohunek "$GITHUB_WORKSPACE"

      - name: Style
        run: brew style zajca/pohunek

      - name: Audit
        run: brew audit --strict --online --formula "zajca/pohunek/${{ matrix.formula }}"

      - name: Install
        run: brew install "zajca/pohunek/${{ matrix.formula }}"

      - name: Test
        run: brew test "zajca/pohunek/${{ matrix.formula }}"

      - name: Check quarantine and signatures
        run: scripts/check-installed "${{ matrix.formula }}"

      - name: Check that the installed core supports the surface protocol
        if: ${{ matrix.surface }}
        run: scripts/check-compatible "$SURFACE_PROTOCOL"

      - name: Verify the release archive attestation
        run: |
          set -euo pipefail
          archive="$(brew --cache "${{ matrix.formula }}")"
          gh attestation verify "$archive" --repo "${{ matrix.repository }}"
