name: Bump

# Scheduled workflows of a public repository are disabled after 60 days
# without repository activity. A manual run (workflow_dispatch) is the fallback
# and re-enables the schedule.
on:
  workflow_dispatch:
    inputs:
      formula:
        description: "Formula to bump (default: every formula); required with a tag"
        required: false
        type: choice
        options: ["", pohunek, pohunek-gui, pohunek-web]
      tag:
        description: "Release tag to point the formula at, with the formula's prefix (v, gui-v or web-v); default: newest release of that surface"
        required: false
        type: string
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: write

concurrency:
  group: bump
  cancel-in-progress: false

jobs:
  bump:
    name: bump (${{ matrix.formula }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        formula: [pohunek, pohunek-gui, pohunek-web]
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
      ONLY_FORMULA: ${{ inputs.formula }}
      FORMULA: ${{ matrix.formula }}
    steps:
      - name: Check out the tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Update the formula
        run: |
          set -euo pipefail
          if [ -n "$TAG" ] && [ -z "$ONLY_FORMULA" ]; then
            echo "::error::a tag needs the formula input: each formula has its own tag prefix"
            exit 1
          fi
          if [ -n "$ONLY_FORMULA" ] && [ "$ONLY_FORMULA" != "$FORMULA" ]; then
            echo "skipped: only $ONLY_FORMULA was requested"
            exit 0
          fi
          if [ -n "$TAG" ]; then
            scripts/bump "$FORMULA" "$TAG"
          else
            scripts/bump "$FORMULA"
          fi

      # A push made with GITHUB_TOKEN does not start other workflows, so the
      # CI workflow does not run for the bump commit; run it manually when a
      # check is wanted.
      - name: Commit and push
        run: |
          set -euo pipefail
          if git diff --quiet -- "Formula/$FORMULA.rb"; then
            echo "formula already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          version="$(sed -n 's|^  url ".*/download/[a-z-]*v\([0-9.]*\)/.*|\1|p' "Formula/$FORMULA.rb")"
          git add "Formula/$FORMULA.rb"
          git commit -m "Update $FORMULA to $version"
          git pull --rebase origin main
          git push origin HEAD:main
