name: Bump

# Scheduled workflows of a public repository are disabled after 60 days
# without repository activity. A manual run (workflow_dispatch) is the fallback
# and re-enables the schedule.
on:
  workflow_dispatch:
    inputs:
      formula:
        description: "Formula to bump; a tag needs a single formula"
        required: false
        default: all
        type: choice
        options: [all, pohunek, pohunek-gui, pohunek-web]
      tag:
        description: "Release tag to point the formula at, with the formula's prefix (v, gui-v or web-v); default: newest release of that surface"
        required: false
        type: string
  # Sent by zajca/pohunek-work (notify-tap.yml) once a gui or web release is
  # published; the payload carries `formula` and `tag`. Dispatch events only run
  # from the default branch.
  repository_dispatch:
    types: [pohunek-work-release]
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: write

# One group per formula, so that releases of different surfaces do not replace
# each other while queued.
concurrency:
  group: bump-${{ github.event.client_payload.formula || inputs.formula || 'all' }}
  cancel-in-progress: false

jobs:
  bump:
    name: bump (${{ matrix.formula }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        formula: [pohunek, pohunek-gui, pohunek-web]
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag || github.event.client_payload.tag }}
      ONLY_FORMULA: ${{ inputs.formula || github.event.client_payload.formula }}
      FORMULA: ${{ matrix.formula }}
    steps:
      - name: Check out the tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Update the formula
        run: |
          set -euo pipefail
          # A scheduled run has no inputs, so an empty value means every formula.
          if [ "$ONLY_FORMULA" = "all" ]; then
            ONLY_FORMULA=""
          fi
          # The payload of a dispatch is input from outside: an unknown formula
          # must fail instead of skipping every matrix job.
          case "$ONLY_FORMULA" in
            "" | pohunek | pohunek-gui | pohunek-web) ;;
            *)
              echo "::error::unknown formula: $ONLY_FORMULA"
              exit 1
              ;;
          esac
          if [ -n "$TAG" ] && [ -z "$ONLY_FORMULA" ]; then
            echo "::error::a tag needs a single formula: each formula has its own tag prefix"
            exit 1
          fi
          if [ -n "$ONLY_FORMULA" ] && [ "$ONLY_FORMULA" != "$FORMULA" ]; then
            echo "skipped: only $ONLY_FORMULA was requested"
            exit 0
          fi
          if [ -n "$TAG" ]; then
            scripts/bump "$FORMULA" "$TAG"
          else
            scripts/bump "$FORMULA"
          fi

      # A push made with GITHUB_TOKEN does not start other workflows, so the
      # CI workflow does not run for the bump commit; run it manually when a
      # check is wanted.
      - name: Commit and push
        run: |
          set -euo pipefail
          if git diff --quiet -- "Formula/$FORMULA.rb"; then
            echo "formula already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          version="$(sed -n 's|^  url ".*/download/[a-z-]*v\([0-9.]*\)/.*|\1|p' "Formula/$FORMULA.rb")"
          git add "Formula/$FORMULA.rb"
          git commit -m "Update $FORMULA to $version"
          # Bumps of different formulas can run at the same time and push to main.
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "push attempt $attempt failed"
          done
          echo "::error::could not push the bump commit"
          exit 1
